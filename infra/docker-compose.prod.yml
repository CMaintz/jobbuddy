# Production Docker Compose — use with:
#   docker compose --env-file ../.env -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. .env filled with real values (see .env.example)
#   2. SSL cert + key at infra/ssl/cert.pem and infra/ssl/key.pem
#      (e.g. from Let's Encrypt: certbot certonly --standalone -d yourdomain.com)
#   3. .secrets/firebase-service-account.json present

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoapplicant
      POSTGRES_USER: autoapplicant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapplicant -d autoapplicant"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M


  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - ../.secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
      - uploads_data:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/autoapplicant
      SPRING_DATASOURCE_USERNAME: autoapplicant
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-service-account.json
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SWAGGER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Override the dev nginx config with the production one (adds HTTPS + redirect)
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certs — generate with Let's Encrypt or your CA
      # certbot certonly --standalone -d yourdomain.com
      # Then copy: cert.pem → infra/ssl/cert.pem, privkey.pem → infra/ssl/key.pem
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  postgres_data:
  uploads_data:
