<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; background: #16181d; color: #e7e9ee; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { margin: 0 0 10px; color: #9aa0ae; }
    button { width: 100%; padding: 8px 10px; border: none; border-radius: 6px; background: #f5a623; color: #1a1c22; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 8px; font-size: 12px; color: #9aa0ae; min-height: 16px; }
    label { display: block; margin-top: 12px; font-size: 11px; color: #9aa0ae; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; border-radius: 5px; border: 1px solid #2c2f37; background: #1d2026; color: #e7e9ee; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Jobbuddy</h1>
  <p>Grab this job posting and open it in Jobbuddy, ready to generate.</p>
  <button id="capture">Capture this job</button>
  <div id="status"></div>
  <label>Jobbuddy URL
    <input id="app-url" type="text" placeholder="http://localhost:4200" />
  </label>
  <script src="popup.js"></script>
</body>
</html>
