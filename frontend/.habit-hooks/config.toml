# Frontend structural smells (habit-hooks TypeScript + generic plugins).
# Run from frontend/ so eslint, knip, ts-morph and jscpd resolve from
# frontend/node_modules. knip finds dead files/exports/deps; jscpd finds
# duplication; the line-count sensor finds oversized files.
plugins = ["typescript", "generic"]

# Tests are not structural-smell-gated — spec files legitimately have long,
# repetitive arrange/act/assert blocks. A positive include is REQUIRED — a bare
# "!exclusion" matches nothing and silently disables the whole scan.
files = ["**/*.ts", "**/*.tsx", "!**/*.spec.ts", "!**/*.spec.tsx", "!**/*.test.ts", "!**/*.test.tsx"]
