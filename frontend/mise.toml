# Frontend (Angular) — the six-verb interface the foundry gate.yml@v2 facade calls
# (stack: ts, working_directory: frontend). Verbs delegate to the package.json
# scripts so there's a single source of truth for HOW each check runs.
[tools]
node = "22"

[env]
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-typescript"
# The npm-audit-ratchet script is provisioned by setup:foundry-scripts into a cache dir at
# this ref, not vendored into the repo (see that task for why). Renovate tracks the pin via
# the comment above it.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.13.0"
# The habit-hooks venv bin (Linux `bin/`, Windows `Scripts/`; a missing one is harmless).
_.path = [
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
]

[hooks]
# Lists everything this package needs, so it holds whether mise merges or overrides
# the root postinstall. Each task no-ops on a warm install.
postinstall = ["mise run setup:frontend", "mise run setup:habit-hooks", "mise run setup:foundry-scripts"]

[tasks.fix]
description = "Auto-fix lint findings"
run = "npm run lint -- --fix"

[tasks.lint]
description = "ng lint (warnings advisory, errors fail) + structural smells on changed files"
run = ["npm run lint", "mise run smells"]

# Pinned habit-hooks (structural-smell detector), provisioned into a per-plugin venv
# by `mise install` (postinstall) so the same version runs in-loop, in `gate` and in CI.
# Keep HABIT_HOOKS_VERSION equal to the facade's `habit_hooks_version` default.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + plugin into a venv (smell detector)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Fetch the pinned npm-audit-ratchet script into a cache dir, rather than vendoring a copy
# into the repo. Why: it's agent/CI plumbing, not the repo's own code; a vendored copy drifts
# from Foundry and has to be re-synced on every bump. Pinned to FOUNDRY_SCRIPTS_REF and
# provisioned once (postinstall / `mise install`), like setup:habit-hooks. Offline-safe: when
# the script is already cached at this ref it makes no network call, so the gate hot path never
# depends on the network. A ref bump needs the network once (same contract as any pinned bump).
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry gate scripts into a cache dir (de-vendored)"
run = '''
set -eu
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
scripts="npm-audit-ratchet.mjs"
need=""
for s in $scripts; do [ -f "$dst/$s" ] || need="$need $s"; done
[ -z "$need" ] && exit 0
mkdir -p "$dst"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF/scripts"
for s in $need; do
  if ! curl -fsSL "$base/$s" -o "$dst/$s.part"; then
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    rm -f "$dst/$s.part"; exit 1
  fi
  mv "$dst/$s.part" "$dst/$s"
  case "$s" in *.mjs) : ;; *) chmod +x "$dst/$s" 2>/dev/null || true ;; esac
done
'''

# Structural smells on files changed vs FOUNDRY_BASE_REF (PR base SHA in CI, origin/main
# locally), folded into `lint`. Calls the pinned venv binary directly so a global install
# can't shadow the pin. Skips without a .habit-hooks config/baseline or a resolvable base;
# fails only when a baseline exists but the pinned binary is missing (run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

# typecheck == the compile. `ng build` does the full template + type check that
# `tsc --noEmit` misses — build is folded into typecheck here, exactly as Java's
# typecheck is compileJava and .NET's is `dotnet build`. No separate "build" verb.
[tasks.typecheck]
description = "ng build — full template + type compile"
run = "npm run build"

[tasks.test]
description = "ng test (Vitest on jsdom) with coverage"
run = "npm run test:ci"

[tasks.audit]
description = "npm advisory DB — fail on un-accepted criticals (ratcheted allowlist)"
# Ratcheted npm audit: fails on any critical NOT in .audit-allowlist.json, and on
# stale allowlist entries (so accepted debt can only shrink). Allowlist is currently empty.
# The ratchet script is cached by setup:foundry-scripts; address it through $HOME in plain
# shell, NOT a mise `{{...}}` template, because on Windows a templated path carries backslashes
# bash would strip. The pipe hands the script npm's JSON so `npm` resolves in the shell.
run = 'npm audit --json | node "$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF/npm-audit-ratchet.mjs" --level=critical --allowlist=.audit-allowlist.json'

[tasks.gate]
description = "The deterministic gate — lint, typecheck (build), test, audit, in order"
# The one setup:foundry-scripts dep provisions the cached ratchet script first (idempotent,
# ordered-first) - a safety net for a ref bump not yet followed by `mise install`. Do NOT add
# the VERBS as `depends`: mise runs dependencies in parallel with no ordering guarantee, which
# interleaves ng build/test and hides which verb failed first. The verbs stay in the
# sequential array below. (See foundry/mise/ts.toml.)
depends = ["setup:foundry-scripts"]
run = [
    "mise run lint",
    "mise run typecheck",
    "mise run test",
    "mise run audit",
]
