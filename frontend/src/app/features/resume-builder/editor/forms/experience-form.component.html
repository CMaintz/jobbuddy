
    <div style="display:flex;flex-direction:column;gap:14px;">
      @for (exp of experience; track exp.id; let i = $index) {
        <div class="rb-card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;font-weight:500;color:var(--jb-text);">{{ exp.title || 'New Position' }}</span>
            <button class="rb-remove" (click)="remove(exp.id)">Remove</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div style="grid-column:span 2;">
              <label class="rb-label">Job Title</label>
              <input class="rb-input" [value]="exp.title" (input)="update(exp.id, 'title', $any($event.target).value)" placeholder="Software Engineer" />
            </div>
            <div>
              <label class="rb-label">Company</label>
              <input class="rb-input" [value]="exp.company" (input)="update(exp.id, 'company', $any($event.target).value)" placeholder="Acme Corp" />
            </div>
            <div>
              <label class="rb-label">Location</label>
              <input class="rb-input" [value]="exp.location" (input)="update(exp.id, 'location', $any($event.target).value)" placeholder="Remote" />
            </div>
            <div>
              <label class="rb-label">Start Date</label>
              <app-month-year-picker [value]="exp.startDate" (valueChange)="update(exp.id, 'startDate', $event)" />
            </div>
            <div>
              <label class="rb-label">End Date</label>
              @if (!exp.current) {
                <app-month-year-picker [value]="exp.endDate" (valueChange)="update(exp.id, 'endDate', $event)" />
              } @else {
                <p style="font-size:11px;color:var(--jb-text-faint);margin-top:8px;">Present</p>
              }
            </div>
            <div style="grid-column:span 2;display:flex;align-items:center;gap:8px;">
              <input type="checkbox" [id]="'current-' + exp.id" [checked]="exp.current" (change)="update(exp.id, 'current', $any($event.target).checked)" style="border-radius:3px;" />
              <label [for]="'current-' + exp.id" style="font-size:11px;color:var(--jb-text-dim);">Currently working here</label>
            </div>
            <div style="grid-column:span 2;">
              <label class="rb-label">Description</label>
              <app-debounced-textarea [value]="exp.description" [rows]="3" placeholder="Describe your role and achievements..." (debouncedChange)="update(exp.id, 'description', $event)" />
            </div>
            <div style="grid-column:span 2;">
              <label class="rb-label">Skills (comma separated)</label>
              <input class="rb-input" [value]="(exp.skills ?? []).join(', ')" (change)="updateSkills(exp.id, $any($event.target).value)" placeholder="TypeScript, React, Node.js" />
            </div>
          </div>
        </div>
      }
      <button class="rb-add" (click)="add()">+ Add Work Experience</button>
    </div>
