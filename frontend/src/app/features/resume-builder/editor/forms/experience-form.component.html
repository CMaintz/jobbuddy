
    <div class="flex flex-col gap-3.5">
      @for (exp of experience; track exp.id; let i = $index) {
        <div class="card p-3 flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-jb-text">{{ exp.title || ('resumeBuilder.form.newPosition' | translate) }}</span>
            <button class="rb-remove" (click)="remove(exp.id)">{{ 'resumeBuilder.form.remove' | translate }}</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div style="grid-column:span 2;">
              <label class="label">{{ 'resumeBuilder.form.jobTitle' | translate }}</label>
              <input class="input" [value]="exp.title" (input)="update(exp.id, 'title', $any($event.target).value)" placeholder="Software Engineer" />
            </div>
            <div>
              <label class="label">{{ 'resumeBuilder.form.company' | translate }}</label>
              <input class="input" [value]="exp.company" (input)="update(exp.id, 'company', $any($event.target).value)" placeholder="Acme Corp" />
            </div>
            <div>
              <label class="label">{{ 'resumeBuilder.form.location' | translate }}</label>
              <input class="input" [value]="exp.location" (input)="update(exp.id, 'location', $any($event.target).value)" placeholder="Remote" />
            </div>
            <div>
              <label class="label">{{ 'resumeBuilder.form.startDate' | translate }}</label>
              <app-month-year-picker [value]="exp.startDate" (valueChange)="update(exp.id, 'startDate', $event)" />
            </div>
            <div>
              <label class="label">{{ 'resumeBuilder.form.endDate' | translate }}</label>
              @if (!exp.current) {
                <app-month-year-picker [value]="exp.endDate" (valueChange)="update(exp.id, 'endDate', $event)" />
              } @else {
                <p class="text-xs text-jb-text-faint mt-2">{{ 'resumeBuilder.form.present' | translate }}</p>
              }
            </div>
            <div class="col-span-2 flex items-center gap-2">
              <input type="checkbox" [id]="'current-' + exp.id" [checked]="exp.current" (change)="update(exp.id, 'current', $any($event.target).checked)" style="border-radius:3px;" />
              <label [for]="'current-' + exp.id" class="text-xs text-jb-text-dim">{{ 'resumeBuilder.form.currentlyWorking' | translate }}</label>
            </div>
            <div style="grid-column:span 2;">
              <div class="flex justify-between items-center mb-1">
                <label class="label" style="margin-bottom:0;">{{ 'resumeBuilder.form.description' | translate }}</label>
                <app-ai-refine-menu [content]="exp.description" [jobDescription]="jobDescription"
                  (refined)="update(exp.id, 'description', $event)" />
              </div>
              <app-rich-text-editor [value]="exp.description" [placeholder]="'resumeBuilder.form.descPlaceholderExp' | translate" (debouncedChange)="update(exp.id, 'description', $event)" />
            </div>
            <div style="grid-column:span 2;">
              <label class="label">{{ 'resumeBuilder.form.skillsComma' | translate }}</label>
              <input class="input" [value]="(exp.skills ?? []).join(', ')" (change)="updateSkills(exp.id, $any($event.target).value)" placeholder="TypeScript, React, Node.js" />
            </div>
          </div>
        </div>
      }
      <button class="rb-add" (click)="add()">{{ 'resumeBuilder.form.addExperience' | translate }}</button>
    </div>
