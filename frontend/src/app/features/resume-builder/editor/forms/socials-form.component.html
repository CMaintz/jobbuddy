
    <div class="flex flex-col gap-3.5">
      @for (s of socials; track s.id) {
        <div class="card p-3 flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-jb-text">{{ s.platform || ('resumeBuilder.form.newSocial' | translate) }}</span>
            <button class="rb-remove" (click)="remove(s.id)">{{ 'resumeBuilder.form.remove' | translate }}</button>
          </div>
          <label class="label">{{ 'resumeBuilder.form.platform' | translate }}</label>
          <select class="input" [value]="s.platform" (change)="onPlatformChange(s.id, $any($event.target).value)">
            @for (p of platforms; track p.platform) {
              <option [value]="p.platform">{{ p.platform }}</option>
            }
          </select>
          <label class="label">{{ 'resumeBuilder.form.url' | translate }}</label>
          <input class="input" [value]="s.url" (input)="update(s.id, 'url', $any($event.target).value)" placeholder="https://linkedin.com/in/you" />
          <label class="label">{{ 'resumeBuilder.form.usernameOptional' | translate }}</label>
          <input class="input" [value]="s.username ?? ''" (input)="update(s.id, 'username', $any($event.target).value)" placeholder="@yourhandle" />
          <app-icon-picker
            [label]="'resumeBuilder.form.icon' | translate"
            [icons]="iconLibrary"
            [selected]="s.iconKey"
            (iconSelected)="update(s.id, 'iconKey', $event)"
          />
        </div>
      }
      <button class="rb-add" (click)="add()">{{ 'resumeBuilder.form.addSocial' | translate }}</button>
    </div>
