
    <div style="display:flex;flex-direction:column;gap:12px;">
      <!-- Photo -->
      <div style="display:flex;align-items:center;gap:12px;">
        @if (pi.photoUrl) {
          <img [src]="pi.photoUrl" alt="Photo"
            style="width:56px;height:56px;object-fit:cover;border:1px solid var(--jb-border);"
            [style.border-radius]="photoShape === 'circle' ? '50%' : photoShape === 'rounded' ? '12px' : '4px'" />
        } @else {
          <div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--jb-surface-2);border:1px dashed var(--jb-border-strong);color:var(--jb-text-dim);font-size:11px;"
            [style.border-radius]="photoShape === 'circle' ? '50%' : '8px'">Photo</div>
        }
        <div style="display:flex;gap:6px;">
          <input type="file" accept="image/*" class="hidden" #photoInput (change)="onPhotoSelected($event)" style="display:none;" />
          <button class="btn btn-sm" (click)="photoInput.click()">{{ pi.photoUrl ? 'Replace' : 'Upload' }}</button>
          @if (pi.photoUrl) {
            <button class="btn btn-sm" (click)="recrop()">Re-crop</button>
            <button class="btn btn-sm btn-danger" (click)="removePhoto()">Remove</button>
          }
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="grid-column:span 2;">
          <label class="rb-label">Full Name</label>
          <input class="rb-input" type="text" [value]="pi.fullName" (input)="update('fullName', $any($event.target).value)" placeholder="Jane Doe" />
        </div>
        <div style="grid-column:span 2;">
          <label class="rb-label">Job Title</label>
          <input class="rb-input" type="text" [value]="pi.title" (input)="update('title', $any($event.target).value)" placeholder="Senior Software Engineer" />
        </div>
        <div>
          <label class="rb-label">Email</label>
          <input class="rb-input" type="email" [value]="pi.email" (input)="update('email', $any($event.target).value)" placeholder="jane@example.com" />
        </div>
        <div>
          <label class="rb-label">Phone</label>
          <input class="rb-input" type="tel" [value]="pi.phone" (input)="update('phone', $any($event.target).value)" placeholder="+1 234 567 8900" />
        </div>
        <div style="grid-column:span 2;">
          <label class="rb-label">Location</label>
          <input class="rb-input" type="text" [value]="pi.location" (input)="update('location', $any($event.target).value)" placeholder="New York, NY" />
        </div>
        <div style="grid-column:span 2;">
          <label class="rb-label">Website</label>
          <input class="rb-input" type="url" [value]="pi.website" (input)="update('website', $any($event.target).value)" placeholder="https://yoursite.com" />
        </div>
        <div>
          <label class="rb-label">LinkedIn</label>
          <input class="rb-input" type="text" [value]="pi.linkedin" (input)="update('linkedin', $any($event.target).value)" placeholder="linkedin.com/in/jane" />
        </div>
        <div>
          <label class="rb-label">GitHub</label>
          <input class="rb-input" type="text" [value]="pi.github" (input)="update('github', $any($event.target).value)" placeholder="github.com/jane" />
        </div>
        <div style="grid-column:span 2;">
          <label class="rb-label">Summary</label>
          <app-rich-text-editor
            [value]="pi.summary"
           
            placeholder="A brief professional summary..."
            (debouncedChange)="update('summary', $event)"
          />
        </div>
      </div>
    </div>

    @if (cropSrc(); as src) {
      <app-photo-crop-dialog [src]="src" [shape]="photoShape"
        (cropped)="onCropped($event)" (cancelled)="cropSrc.set(null)" />
    }
