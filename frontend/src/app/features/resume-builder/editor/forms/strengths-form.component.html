
    <div class="flex flex-col gap-3.5">
      @for (s of strengths; track s.id) {
        <div class="card p-3 flex flex-col gap-2">
          <div class="flex justify-between items-center">
            <lucide-icon [img]="getIcon(s.iconKey)" [size]="18" [strokeWidth]="1.5" style="color:var(--jb-text-dim);"></lucide-icon>
            <button class="rb-remove" (click)="remove(s.id)">{{ 'resumeBuilder.form.remove' | translate }}</button>
          </div>
          <label class="label">{{ 'resumeBuilder.form.title' | translate }}</label>
          <input class="input" [value]="s.title"
                 (input)="update(s.id, 'title', $any($event.target).value)"
                 [placeholder]="'resumeBuilder.form.strengthTitlePlaceholder' | translate" />
          <label class="label">{{ 'resumeBuilder.form.description' | translate }}</label>
          <app-debounced-textarea [value]="s.description" [rows]="2"
                    (debouncedChange)="update(s.id, 'description', $event)"
                    [placeholder]="'resumeBuilder.form.strengthDescPlaceholder' | translate" />
          <app-icon-picker
            [label]="'resumeBuilder.form.icon' | translate"
            [selected]="s.iconKey"
            (iconSelected)="update(s.id, 'iconKey', $event)"
          />
        </div>
      }
      <button class="rb-add" (click)="add()">{{ 'resumeBuilder.form.addStrength' | translate }}</button>
    </div>
