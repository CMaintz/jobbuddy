
    <div class="flex flex-col items-center gap-4">
      <!-- PDF controls -->
      <div class="flex gap-2 w-full max-w-[794px]">
        <jb-button primary icon="download" (clicked)="downloadPdf()">{{ 'resumeBuilder.preview.pdfDesigned' | translate }}</jb-button>
        <jb-button icon="doc" [title]="'resumeBuilder.preview.atsTitle' | translate"
          (clicked)="downloadAtsPdf()">{{ 'resumeBuilder.preview.pdfAts' | translate }}</jb-button>
        <jb-button icon="copy" (clicked)="printResume()">{{ 'resumeBuilder.preview.print' | translate }}</jb-button>
      </div>
      <jb-page-budget-warning class="w-full max-w-[794px]" [budget]="exportedPages.current()" />
      @if (previewFailed()) {
        <p role="status" class="w-full max-w-[794px] text-sm text-jb-text-dim">{{ 'resumeBuilder.preview.unavailable' | translate }}</p>
      }

      <!-- The pages of the PDF itself, rendered by the backend -->
      <div id="previewContainer" class="flex flex-col gap-6" [style.width.px]="docWidth">
        @for (page of pages(); track $index) {
          <img [src]="page" [alt]="'resumeBuilder.preview.pageAlt' | translate:{ page: $index + 1 }"
            class="block w-full bg-white shadow-[0_18px_60px_rgba(0,0,0,0.45)]" />
        } @empty {
          <div class="animate-pulse bg-gray-50" [style.height.px]="docWidth * 1.414"></div>
        }
      </div>
    </div>
