
    <div class="flex flex-col gap-1.5">
      @if (label) {
        <span class="text-xs font-medium text-jb-text-dim">{{ label }}</span>
      }
      <div class="grid grid-cols-8 gap-1">
        @for (icon of icons; track icon.key) {
          <button
            type="button"
            class="rb-icon-btn"
            [class.active]="selected === icon.key"
            [title]="icon.label"
            (click)="iconSelected.emit(icon.key)"
          >
            <lucide-icon [img]="icon.icon" [size]="16" [strokeWidth]="1.5"></lucide-icon>
          </button>
        }
      </div>
    </div>
