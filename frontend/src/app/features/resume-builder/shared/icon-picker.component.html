
    <div style="display:flex;flex-direction:column;gap:6px;">
      @if (label) {
        <span style="font-size:11px;font-weight:500;color:var(--jb-text-dim);">{{ label }}</span>
      }
      <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;">
        @for (icon of icons; track icon.key) {
          <button
            type="button"
            class="rb-icon-btn"
            [class.active]="selected === icon.key"
            [title]="icon.label"
            (click)="iconSelected.emit(icon.key)"
          >
            <lucide-icon [img]="icon.icon" [size]="16" [strokeWidth]="1.5"></lucide-icon>
          </button>
        }
      </div>
    </div>
