
    <div class="min-h-screen flex items-center justify-center">
      <div class="card w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">{{ 'auth.login.title' | translate }}</h1>
        @if (error) {
          <div class="bg-red-50 text-red-700 rounded-md p-3 mb-4 text-sm">{{ error | translate }}</div>
        }
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
          <div>
            <label class="label">{{ 'auth.email' | translate }}</label>
            <input type="email" formControlName="email" class="input" placeholder="you@example.com" />
          </div>
          <div>
            <label class="label">{{ 'auth.password' | translate }}</label>
            <input type="password" formControlName="password" class="input" placeholder="••••••••" />
          </div>
          <button type="submit" [disabled]="form.invalid || loading" class="btn-primary w-full">
            {{ (loading ? 'auth.login.signingIn' : 'auth.login.signIn') | translate }}
          </button>
        </form>
        <div class="mt-4 relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-white px-2 text-gray-400">{{ 'auth.or' | translate }}</span>
          </div>
        </div>
        <button (click)="signInWithLinkedIn()" type="button"
            class="mt-3 w-full flex items-center justify-center gap-2 border border-gray-300 rounded-md px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="#0A66C2" viewBox="0 0 24 24">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
          {{ 'auth.login.withLinkedIn' | translate }}
        </button>
        <p class="mt-4 text-sm text-gray-600">
          {{ 'auth.login.noAccount' | translate }} <a routerLink="/register" class="text-blue-600 hover:underline">{{ 'auth.login.registerLink' | translate }}</a>
        </p>
        <p class="mt-2 text-xs text-gray-400">
          <a routerLink="/privacy" class="hover:underline">{{ 'auth.privacyPolicy' | translate }}</a>
        </p>
      </div>
    </div>
