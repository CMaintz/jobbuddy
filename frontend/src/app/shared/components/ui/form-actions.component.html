    <div class="flex gap-2">
      <button type="submit" [disabled]="disabled" class="btn-primary text-sm px-3 py-1.5">
        {{ saveLabel }}
      </button>
      @if (showCancel) {
        <button type="button" (click)="cancel.emit()" class="btn-secondary text-sm px-3 py-1.5">
          {{ cancelLabel }}
        </button>
      }
    </div>
