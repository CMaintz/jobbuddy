<span class="text-2xs font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded-full whitespace-nowrap cursor-default"
      [style.background]="color.bg"
      [style.color]="color.fg"
      [style.border]="'1px solid ' + color.border"
      [title]="'match.scoreTooltip' | translate:{ score: score }">{{ labelKey | translate }}</span>
