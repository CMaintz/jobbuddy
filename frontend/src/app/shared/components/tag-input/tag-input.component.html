    <div class="flex flex-wrap gap-1.5 p-[8px_10px] bg-jb-surface-2 border border-jb-border rounded-md min-h-[36px] items-center">
      <span *ngFor="let tag of value; let i = index"
        class="inline-flex items-center gap-1 p-[2px_8px] rounded-full text-sm font-medium bg-jb-accent-soft border border-jb-accent-border text-jb-accent-2">
        {{ tag }}
        <button (click)="removeTag(i)" class="bg-transparent border-none cursor-pointer p-0 text-inherit flex">
          <jb-icon name="x" [size]="9" [strokeWidth]="2.5" />
        </button>
      </span>
      <input [(ngModel)]="inputValue" (keydown.enter)="addTag()" (keydown.backspace)="onBackspace()"
        [placeholder]="value.length === 0 ? placeholder : ''"
        class="bg-transparent border-none outline-none text-sm text-jb-text flex-1 min-w-[60px] p-0" />
    </div>
