# HTTP — serves all traffic in local Docker dev.
# In production this file is overridden by a volume mount in docker-compose.prod.yml
# that adds the HTTPS server block (see infra/nginx.prod.conf).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target: answers on plain HTTP so the probe never follows a redirect.
    location = /healthz {
        access_log off;
        return 200;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # AI generation through a local CLI agent answers after up to AI_REQUEST_TIMEOUT_SECONDS;
        # nginx's 60 s default would cut it off with a 504 while the work still completes.
        proxy_read_timeout 1110s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
