# Foundry verb interface — AutoApplicant monorepo. See github.com/CMaintz/foundry.
#
# THIN root. Each package pins its OWN toolchain + the six verbs:
#   backend/mise.toml  — JDK, PMD, jscpd + ../gradlew :backend: verbs
#   frontend/mise.toml — Node + npm verbs (ng build, ratcheted npm audit)
# That's exactly what the foundry facade runs per package in CI (one mise-action per
# working_directory), so the frontend gate never installs a JDK/PMD it doesn't use,
# and the backend gate never installs Node-for-nothing.
#
# These root tasks only DELEGATE into the sub-configs (dir + a nested `mise run`), so a
# developer at the repo root still gets `mise run gate` across both packages. Nested
# `mise run` resolves the nearer config, which is how each verb picks up its package's
# toolchain. The extension is static JS/HTML with no build — its only check is the CI
# max-file gate.
#
# (Windows one-time: `mise settings set windows_default_inline_shell_args "bash -c"`,
# kept in GLOBAL config so ./gradlew + vendor bins resolve under bash.)

# ---- backend delegators (toolchain + real commands live in backend/mise.toml) ----
[tasks."backend:fix"]
dir = "backend"
run = "mise run fix"
[tasks."backend:lint"]
dir = "backend"
run = "mise run lint"
[tasks."backend:typecheck"]
dir = "backend"
run = "mise run typecheck"
[tasks."backend:test"]
dir = "backend"
run = "mise run test"
[tasks."backend:audit"]
dir = "backend"
run = "mise run audit"
[tasks."backend:spotbugs"]
dir = "backend"
run = "mise run spotbugs"
[tasks."backend:gate"]
dir = "backend"
run = "mise run gate"

# ---- frontend delegators (toolchain + real commands live in frontend/mise.toml) ----
[tasks."frontend:fix"]
dir = "frontend"
run = "mise run fix"
[tasks."frontend:lint"]
dir = "frontend"
run = "mise run lint"
[tasks."frontend:typecheck"]
dir = "frontend"
run = "mise run typecheck"
[tasks."frontend:test"]
dir = "frontend"
run = "mise run test"
[tasks."frontend:audit"]
dir = "frontend"
run = "mise run audit"
[tasks."frontend:gate"]
dir = "frontend"
run = "mise run gate"

# ---- aggregates — run every package's verb (sequential; NOT `depends`, which is parallel) ----
[tasks.fix]
description = "Auto-fix every package"
run = ["mise run backend:fix", "mise run frontend:fix"]
[tasks.lint]
description = "Lint every package"
run = ["mise run backend:lint", "mise run frontend:lint"]
[tasks.typecheck]
description = "Type-check every package"
run = ["mise run backend:typecheck", "mise run frontend:typecheck"]
[tasks.test]
description = "Test every package"
run = ["mise run backend:test", "mise run frontend:test"]
[tasks.audit]
description = "Audit every package"
run = ["mise run backend:audit", "mise run frontend:audit"]
[tasks.gate]
description = "The oracle — every package's gate, sequential."
run = ["mise run backend:gate", "mise run frontend:gate"]
