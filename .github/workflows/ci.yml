name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Spotless ratchetFrom origin/main needs history, not a shallow tip

      # Runs the same verb a developer runs locally: `mise run backend:gate`
      # (Spotless format check + compile + the offline test suite). mise pins
      # java 21 + node 20 from mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
      # Cache Gradle deps + build across runs (mise pins the JDK but not ~/.gradle).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gate (lint + typecheck + test)
        run: mise run backend:gate

      - name: Publish test report
        if: always() # a failing run is exactly when the report is worth having
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Warnings are advisory here: the existing accessibility warnings are real but pre-date this
      # pipeline, and failing on them would make CI useless on day one. Errors still fail the run.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits, which contents:read cannot do.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  ruleset-guard:
    name: Ruleset guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Stops a fixer weakening the gate in the same change that "fixes" it.
      # Loosening (growing a suppression/snooze baseline, editing a config/threshold)
      # needs a human label; tightening or an inert change does not. Per-entry, so
      # the offset attack (fix one, suppress another) is caught. See scripts/ruleset_guard.py.
      - name: Refuse loosening the gate alongside source changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RULESET_RE: '^(mise\.toml|backend/build\.gradle\.kts|settings\.gradle\.kts|gradle/libs\.versions\.toml|frontend/eslint\.config\.[cm]?js|frontend/eslint-suppressions\.json|backend/\.habit-hooks/|frontend/\.habit-hooks/|\.github/workflows/)'
          SOURCE_RE: '^(backend/src/|frontend/src/|extension/)'
          TEST_RE: '(^backend/src/test/|\.spec\.ts$|\.test\.[jt]sx?$)'
          LABEL: 'ruleset-change'
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          ruleset=$(echo "$changed" | grep -E "$RULESET_RE" || true)
          source=$(echo "$changed" | grep -E "$SOURCE_RE" | grep -vE "$TEST_RE" || true)

          if [ -z "$ruleset" ] || [ -z "$source" ]; then
            echo "OK — no bundled ruleset+source change."
            exit 0
          fi

          if echo "$LABELS" | tr ',' '\n' | grep -qx "$LABEL"; then
            echo "::notice::'$LABEL' label present — deliberate ruleset change, allowing."
            exit 0
          fi

          blob() { git show "$1:$2" 2>/dev/null || true; }

          review=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            old=$(blob "$BASE" "$f"); new=$(blob "$HEAD" "$f")

            if [ "$(printf '%s' "$old" | tr -d '\r')" = "$(printf '%s' "$new" | tr -d '\r')" ]; then
              echo "  safe (no semantic change): $f"; continue
            fi

            case "$f" in
              *eslint-suppressions.json)
                if python3 scripts/ruleset_guard.py eslint "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no suppression added): $f"
                else echo "  REVIEW (suppression added/increased): $f"; review="$review $f"; fi
                ;;
              *snooze.json)
                if python3 scripts/ruleset_guard.py snooze "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no snooze added): $f"
                else echo "  REVIEW (snooze added): $f"; review="$review $f"; fi
                ;;
              *)
                echo "  REVIEW (config — direction can't be proven): $f"; review="$review $f"
                ;;
            esac
          done <<< "$ruleset"

          if [ -n "$review" ]; then
            echo "::error::This PR changes source AND makes ruleset changes that may loosen the gate, without the '$LABEL' label:"
            echo "$review" | tr ' ' '\n' | sed '/^$/d;s/^/  /'
            echo ""
            echo "Tighten in a separate PR, or add the '$LABEL' label if the loosening is deliberate."
            exit 1
          fi
          echo "::notice::Ruleset changes are tightening-only or inert — allowed without a label."

  habits-backend:
    name: Structural smells (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Baseline present?
        id: baseline
        run: |
          if [ -f backend/.habit-hooks/snooze.json ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No backend/.habit-hooks/snooze.json yet - run CI manually (Run workflow) once to bootstrap. Skipping."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: steps.baseline.outputs.have == 'true'
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.baseline.outputs.have == 'true'
        with:
          python-version: '3.12'
      - name: Cache PMD
        if: steps.baseline.outputs.have == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/opt/pmd-bin-7.27.0
          key: pmd-7.27.0
      - name: Install PMD + habit-hooks
        if: steps.baseline.outputs.have == 'true'
        run: |
          if [ ! -x "$HOME/.local/opt/pmd-bin-7.27.0/bin/pmd" ]; then
            mkdir -p "$HOME/.local/opt"
            curl -fsSL -o /tmp/pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases/7.27.0/pmd-dist-7.27.0-bin.zip
            unzip -q /tmp/pmd.zip -d "$HOME/.local/opt"
          fi
          echo "$HOME/.local/opt/pmd-bin-7.27.0/bin" >> "$GITHUB_PATH"
          pip install --disable-pip-version-check habit-hooks habit-hooks-java
      - name: Smells (fails only on smells beyond the snooze baseline)
        if: steps.baseline.outputs.have == 'true'
        working-directory: backend
        run: habit-hooks

  habits-frontend:
    name: Structural smells (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Baseline present?
        id: baseline
        run: |
          if [ -f frontend/.habit-hooks/snooze.json ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No frontend/.habit-hooks/snooze.json yet - run CI manually (Run workflow) once to bootstrap. Skipping."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.baseline.outputs.have == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.baseline.outputs.have == 'true'
        with:
          python-version: '3.12'
      - name: Install deps + habit-hooks
        if: steps.baseline.outputs.have == 'true'
        run: |
          (cd frontend && npm ci)
          pip install --disable-pip-version-check habit-hooks habit-hooks-typescript
      - name: Smells (fails only on smells beyond the snooze baseline)
        if: steps.baseline.outputs.have == 'true'
        working-directory: frontend
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          habit-hooks

  bootstrap-habits-baseline:
    name: Bootstrap habit-hooks baselines
    # Run once, manually (Actions tab -> CI -> Run workflow), ideally on main after
    # merging. Generates both snooze baselines on Linux, where the full-repo file
    # lists do not blow the Windows command-line limit, and commits them.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Cache PMD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/opt/pmd-bin-7.27.0
          key: pmd-7.27.0
      - name: Install tools
        run: |
          if [ ! -x "$HOME/.local/opt/pmd-bin-7.27.0/bin/pmd" ]; then
            mkdir -p "$HOME/.local/opt"
            curl -fsSL -o /tmp/pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases/7.27.0/pmd-dist-7.27.0-bin.zip
            unzip -q /tmp/pmd.zip -d "$HOME/.local/opt"
          fi
          echo "$HOME/.local/opt/pmd-bin-7.27.0/bin" >> "$GITHUB_PATH"
          pip install --disable-pip-version-check habit-hooks habit-hooks-java habit-hooks-typescript
          (cd frontend && npm ci)
      - name: Generate baselines
        run: |
          (cd backend && habit-sensors --all | habit-snooze --snooze)
          (cd frontend && export PATH="$PWD/node_modules/.bin:$PATH" && habit-sensors --all | habit-snooze --snooze)
      - name: Commit baselines
        run: |
          git add backend/.habit-hooks/snooze.json frontend/.habit-hooks/snooze.json
          if git diff --cached --quiet; then echo "baselines unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bootstrap habit-hooks snooze baselines"
          git push

  extension:
    name: Extension max-file
    runs-on: ubuntu-latest
    # The extension is raw JS/HTML with no build, so its only structural check is
    # a file-length cap (habit-hooks has no plugin for it). Grandfathers today's
    # files (max is ~93 lines); fires only if one balloons.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail on oversized extension files
        env:
          MAX: '400'
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt "$MAX" ]; then
              echo "::error file=$f::$f is $n lines (max $MAX)"
              fail=1
            fi
          done < <(find extension -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' \) -print0)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All extension files within $MAX lines."

  images:
    name: Publish images
    # Only for the default branch: a PR proves the code builds, it does not earn a published tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # The frontend bundle carries the Firebase web config, which is public by design (it
      # identifies the project; security comes from Firebase rules). It therefore lives in repo
      # *variables*, not secrets. Unset variables produce an image whose sign-in does not work —
      # set them under Settings → Secrets and variables → Actions → Variables.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
