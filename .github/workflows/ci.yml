name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Spotless ratchetFrom origin/main needs history, not a shallow tip

      # Runs the same verb a developer runs locally: `mise run backend:gate`
      # (Spotless format check + compile + the offline test suite). mise pins
      # java 21 + node 20 from mise.toml.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.2

      - name: Gate (lint + typecheck + test)
        run: mise run backend:gate

      - name: Publish test report
        if: always() # a failing run is exactly when the report is worth having
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Warnings are advisory here: the existing accessibility warnings are real but pre-date this
      # pipeline, and failing on them would make CI useless on day one. Errors still fail the run.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits, which contents:read cannot do.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruleset-guard:
    name: Ruleset guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Stops a fixer weakening the gate in the same change that "fixes" it.
      # Loosening (growing a suppression/snooze baseline, editing a config/threshold)
      # needs a human label; tightening or an inert change does not. Per-entry, so
      # the offset attack (fix one, suppress another) is caught. See scripts/ruleset_guard.py.
      - name: Refuse loosening the gate alongside source changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RULESET_RE: '^(mise\.toml|backend/build\.gradle\.kts|settings\.gradle\.kts|gradle/libs\.versions\.toml|frontend/eslint\.config\.[cm]?js|frontend/eslint-suppressions\.json|\.habit-hooks/|\.github/workflows/)'
          SOURCE_RE: '^(backend/src/|frontend/src/|extension/)'
          TEST_RE: '(^backend/src/test/|\.spec\.ts$|\.test\.[jt]sx?$)'
          LABEL: 'ruleset-change'
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          ruleset=$(echo "$changed" | grep -E "$RULESET_RE" || true)
          source=$(echo "$changed" | grep -E "$SOURCE_RE" | grep -vE "$TEST_RE" || true)

          if [ -z "$ruleset" ] || [ -z "$source" ]; then
            echo "OK — no bundled ruleset+source change."
            exit 0
          fi

          if echo "$LABELS" | tr ',' '\n' | grep -qx "$LABEL"; then
            echo "::notice::'$LABEL' label present — deliberate ruleset change, allowing."
            exit 0
          fi

          blob() { git show "$1:$2" 2>/dev/null || true; }

          review=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            old=$(blob "$BASE" "$f"); new=$(blob "$HEAD" "$f")

            if [ "$(printf '%s' "$old" | tr -d '\r')" = "$(printf '%s' "$new" | tr -d '\r')" ]; then
              echo "  safe (no semantic change): $f"; continue
            fi

            case "$f" in
              *eslint-suppressions.json)
                if python3 scripts/ruleset_guard.py eslint "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no suppression added): $f"
                else echo "  REVIEW (suppression added/increased): $f"; review="$review $f"; fi
                ;;
              *snooze.json)
                if python3 scripts/ruleset_guard.py snooze "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no snooze added): $f"
                else echo "  REVIEW (snooze added): $f"; review="$review $f"; fi
                ;;
              *)
                echo "  REVIEW (config — direction can't be proven): $f"; review="$review $f"
                ;;
            esac
          done <<< "$ruleset"

          if [ -n "$review" ]; then
            echo "::error::This PR changes source AND makes ruleset changes that may loosen the gate, without the '$LABEL' label:"
            echo "$review" | tr ' ' '\n' | sed '/^$/d;s/^/  /'
            echo ""
            echo "Tighten in a separate PR, or add the '$LABEL' label if the loosening is deliberate."
            exit 1
          fi
          echo "::notice::Ruleset changes are tightening-only or inert — allowed without a label."

  images:
    name: Publish images
    # Only for the default branch: a PR proves the code builds, it does not earn a published tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # The frontend bundle carries the Firebase web config, which is public by design (it
      # identifies the project; security comes from Firebase rules). It therefore lives in repo
      # *variables*, not secrets. Unset variables produce an image whose sign-in does not work —
      # set them under Settings → Secrets and variables → Actions → Variables.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
