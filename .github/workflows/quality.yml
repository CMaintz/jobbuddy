# Structural-quality checks: habit-hooks smells (per package), the no-var rule,
# the extension file-length cap, and SpotBugs. Advisory/ratcheted — they guard
# against decay without blocking on pre-existing debt.
name: quality

# PR-only. main is branch-protected and we rebase-merge, so the merged commit is the
# same code the PR gated; a push:main re-run has never caught anything the PR missed,
# and the next PR's gate re-tests integrated main anyway. These checks are also
# advisory/ratcheted and now run in-loop via the habit-hooks-guard Stop hook.
# workflow_dispatch is the manual full-run escape hatch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the monorepo changed — see gate.yml for the rationale.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      extension: ${{ steps.f.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          emit() { { echo "backend=$1"; echo "frontend=$2"; echo "extension=$3"; } >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then emit true true true; exit 0; fi
          base=$(git merge-base "$BASE" "$HEAD")
          diff=$(git diff --name-only "$base" "$HEAD")
          echo "Changed files:"; echo "$diff" | sed 's/^/  /'
          be=false; fe=false; ex=false; all=false
          # FAIL SAFE: a path we can't classify runs everything (never silently skip
          # a check). Only known docs/metadata are treated as "affects no area".
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              */.habit-hooks/snooze.json|*/eslint-suppressions.json) : ;; # tool-regenerated baseline — nothing to gate
              backend/*)   be=true ;;
              frontend/*)  fe=true ;;
              extension/*) ex=true ;;
              *.md|LICENSE|.gitignore|.gitattributes|.editorconfig|docs/*|.claude/*) : ;;
              mise.toml|.github/workflows/*|gradlew|gradlew.bat|gradle/*|settings.gradle*|build.gradle*|.gitleaks.toml|osv-scanner.toml|scripts/*) all=true ;;
              *) echo "  unclassified path '$f' -> running everything (fail-safe)"; all=true ;;
            esac
          done < <(printf '%s\n' "$diff")
          if [ "$all" = true ]; then be=true; fe=true; ex=true; fi
          emit "$be" "$fe" "$ex"

  # Structural smells (backend AND frontend) now run inside the foundry facade
  # (gate.yml → the per-stack habits job), so the former habits-backend / habits-frontend
  # jobs live there. What remains here is jobbuddy-specific: the extension file-length cap
  # and (until foundry#36's `mise run spotbugs` verb ships in @v2) the SpotBugs job.

  extension:
    name: Extension max-file
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    # The extension is raw JS/HTML with no build, so its only structural check is
    # a file-length cap (habit-hooks has no plugin for it). Grandfathers today's
    # files (max is ~93 lines); fires only if one balloons.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail on oversized extension files
        env:
          MAX: '400'
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt "$MAX" ]; then
              echo "::error file=$f::$f is $n lines (max $MAX)"
              fail=1
            fi
          done < <(find extension -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' \) -print0)
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All extension files within $MAX lines."

  spotbugs:
    name: SpotBugs (backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
          cache: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # Blocking: fails on any finding not excluded (config/spotbugs/exclude.xml)
      # or suppressed (@SuppressFBWarnings + justification). The current tree is clean.
      - name: SpotBugs
        run: mise run backend:spotbugs

  # Single required check for this workflow — always runs so a path-skipped job
  # never wedges. Fails only if a job that ran failed.
  quality-ok:
    name: quality-ok
    needs: [changes, extension, spotbugs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.extension.result }}" "${{ needs.spotbugs.result }}"; do
            case "$r" in failure|cancelled) echo "a required job did not pass: $r"; exit 1;; esac
          done
          echo "quality-ok"
