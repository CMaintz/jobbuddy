# Non-build quality checks. The extension is plain JS/HTML/CSS with no habit-hooks
# plugin, so it gets Foundry's max-file-length gate instead.
name: quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: CMaintz/foundry/.github/workflows/changes.yml@4ef6ee4e04eefc9abf76f9164aa95bb0b18d3058 # v2.7.0
    with:
      packages: "backend frontend extension"
      # Builds nothing for these; any other root-level file rebuilds everything (fail-safe).
      ignore_globs: |
        *.md
        docs/*
        .claude/*
        LICENSE
        .gitignore
        .gitattributes
        .editorconfig
        */.habit-hooks/snooze.json
        */eslint-suppressions.json

  extension:
    name: Extension max-file
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'extension')
    uses: CMaintz/foundry/.github/workflows/web.yml@4ef6ee4e04eefc9abf76f9164aa95bb0b18d3058 # v2.7.0
    with:
      root: extension
      extensions: "js html css"
      max_lines: 400

  quality-ok:
    name: quality-ok
    needs: [changes, extension]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Iterates over needs itself, so a job added to needs above is checked
          # automatically. Skipped (path-filtered) is fine; failure/cancelled is not.
          bad="$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result=="failure" or .value.result=="cancelled") | .key')"
          if [ -n "$bad" ]; then echo "::error::job(s) did not pass: $bad"; exit 1; fi
          echo "quality-ok"
