# Non-build quality checks. The extension is plain JS/HTML/CSS with no habit-hooks
# plugin, so it gets Foundry's max-file-length gate instead.
name: quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: CMaintz/foundry/.github/workflows/changes.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    with:
      packages: "backend frontend extension"
      # Builds nothing for these; any other root-level file rebuilds everything (fail-safe).
      ignore_globs: |
        *.md
        docs/*
        .claude/*
        LICENSE
        .gitignore
        .gitattributes
        .editorconfig
        */.habit-hooks/snooze.json
        */eslint-suppressions.json

  extension:
    name: Extension max-file
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'extension')
    uses: CMaintz/foundry/.github/workflows/web.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    with:
      root: extension
      extensions: "js html css"
      max_lines: 400

  quality-ok:
    name: quality-ok
    needs: [changes, extension]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.extension.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "a required job did not pass: $r"; exit 1;; esac
          done
          echo "quality-ok"
