# Secret scan, ruleset-guard and SAST (new findings only), on Foundry's security
# facade. Branch protection requires `security / security-ok`.
name: security

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@4ef6ee4e04eefc9abf76f9164aa95bb0b18d3058 # v2.7.0
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    with:
      # Gate-defining files: changing these alongside source needs the ruleset-change label.
      ruleset_paths: '^(mise\.toml|backend/build\.gradle\.kts|settings\.gradle\.kts|gradle/libs\.versions\.toml|backend/config/pmd/|backend/pmd/|frontend/eslint\.config\.[cm]?js|frontend/eslint-suppressions\.json|backend/\.habit-hooks/|frontend/\.habit-hooks/|\.gitleaks\.toml|\.github/workflows/)'
      source_paths: '^(backend/src/|frontend/src/|extension/)'
      test_paths: '(^backend/src/test/|\.spec\.ts$|\.test\.[jt]sx?$)'
