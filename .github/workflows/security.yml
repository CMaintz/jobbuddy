# Secret scan, ruleset-guard and SAST (new findings only), on Foundry's security
# facade. Branch protection requires `security / security-ok`.
name: security

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@a7ce66217276e6a279be2d3861fa1da7c40cfa76 # v2.11.1
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    with:
      # Gate-defining files: changing these alongside source needs the ruleset-change label.
      ruleset_paths: '^((backend/|frontend/)?mise\.toml|backend/build\.gradle\.kts|settings\.gradle\.kts|gradle/libs\.versions\.toml|backend/config/pmd/|backend/config/spotbugs/|backend/pmd/|backend/osv-scanner\.toml|frontend/eslint\.config\.[A-Za-z.]*[cm]?js|frontend/eslint-suppressions\.json|frontend/\.audit-allowlist\.json|frontend/tsconfig[A-Za-z.]*\.json|backend/\.habit-hooks/|frontend/\.habit-hooks/|scripts/|\.gitleaks\.toml|\.editorconfig|\.github/workflows/)'
      source_paths: '^(backend/src/|frontend/src/|extension/)'
      test_paths: '(^backend/src/test/|\.spec\.ts$|\.test\.[jt]sx?$)'
