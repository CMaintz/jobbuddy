# Security & policy gates: secret scanning, the ruleset-guard (anti-gaming), and
# the backend dependency audit. SAST (Semgrep) lives in semgrep.yml.
name: security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits, which contents:read cannot do.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
      # Turn a bare red X into actionable guidance. Runs only when gitleaks found
      # something; points at the decision (real secret vs false positive) and the
      # foundry-secret skill.
      - name: Remediation guidance
        if: failure()
        run: |
          {
            echo "## 🔑 Secret scan found something"
            echo ""
            echo "**Decide first — is it a real secret, or a false positive?** (Ask if unsure.)"
            echo ""
            echo "- **Real secret** (a live credential): **rotate/revoke it at the provider first**, then remove from code, then purge from history (\`git filter-repo\`) and force-push. Never allowlist a real secret."
            echo "- **False positive** (public-by-design config, a dummy test fixture): add the *specific file path* to \`.gitleaks.toml\` \`[allowlist] paths\`, with a note on why it is not a secret. Never allowlist a whole directory."
            echo ""
            echo "The **\`/foundry-secret\`** skill walks through either path."
            echo ""
            echo "> Routine push/PR scans are incremental (new commits only), so a real new secret is always caught; the allowlist only quiets the full-history audit for confirmed non-secrets."
          } >> "$GITHUB_STEP_SUMMARY"

  ruleset-guard:
    name: Ruleset guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Stops a fixer weakening the gate in the same change that "fixes" it.
      # Loosening (growing a suppression/snooze baseline, editing a config/threshold)
      # needs a human label; tightening or an inert change does not. Per-entry, so
      # the offset attack (fix one, suppress another) is caught. See scripts/ruleset_guard.py.
      - name: Refuse loosening the gate alongside source changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RULESET_RE: '^(mise\.toml|backend/build\.gradle\.kts|settings\.gradle\.kts|gradle/libs\.versions\.toml|backend/config/pmd/|backend/pmd/|frontend/eslint\.config\.[cm]?js|frontend/eslint-suppressions\.json|backend/\.habit-hooks/|frontend/\.habit-hooks/|\.github/workflows/)'
          SOURCE_RE: '^(backend/src/|frontend/src/|extension/)'
          TEST_RE: '(^backend/src/test/|\.spec\.ts$|\.test\.[jt]sx?$)'
          LABEL: 'ruleset-change'
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          ruleset=$(echo "$changed" | grep -E "$RULESET_RE" || true)
          source=$(echo "$changed" | grep -E "$SOURCE_RE" | grep -vE "$TEST_RE" || true)

          if [ -z "$ruleset" ] || [ -z "$source" ]; then
            echo "OK — no bundled ruleset+source change."
            exit 0
          fi

          if echo "$LABELS" | tr ',' '\n' | grep -qx "$LABEL"; then
            echo "::notice::'$LABEL' label present — deliberate ruleset change, allowing."
            exit 0
          fi

          blob() { git show "$1:$2" 2>/dev/null || true; }

          review=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            old=$(blob "$BASE" "$f"); new=$(blob "$HEAD" "$f")

            if [ "$(printf '%s' "$old" | tr -d '\r')" = "$(printf '%s' "$new" | tr -d '\r')" ]; then
              echo "  safe (no semantic change): $f"; continue
            fi

            case "$f" in
              *eslint-suppressions.json)
                if python3 scripts/ruleset_guard.py eslint "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no suppression added): $f"
                else echo "  REVIEW (suppression added/increased): $f"; review="$review $f"; fi
                ;;
              *snooze.json)
                if python3 scripts/ruleset_guard.py snooze "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no snooze added): $f"
                else echo "  REVIEW (snooze added): $f"; review="$review $f"; fi
                ;;
              *)
                echo "  REVIEW (config — direction can't be proven): $f"; review="$review $f"
                ;;
            esac
          done <<< "$ruleset"

          if [ -n "$review" ]; then
            echo "::error::This PR changes source AND makes ruleset changes that may loosen the gate, without the '$LABEL' label:"
            echo "$review" | tr ' ' '\n' | sed '/^$/d;s/^/  /'
            echo ""
            echo "Tighten in a separate PR, or add the '$LABEL' label if the loosening is deliberate."
            exit 1
          fi
          echo "::notice::Ruleset changes are tightening-only or inert — allowed without a label."

  backend-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
      - name: Install osv-scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # BLOCKING: the dependency bumps took the audit to 0 CVEs, so this fails on
      # any new vulnerability. Accept a specific CVE (only with justification) by
      # adding it to backend/osv-scanner.toml.
      - name: Audit backend dependencies
        run: |
          ./gradlew :backend:dependencies --write-locks --console=plain
          osv-scanner --lockfile=backend/gradle.lockfile
