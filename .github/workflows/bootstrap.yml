# Manual: refresh the habit-hooks snooze baselines on Linux (the full-repo file
# list blows the Windows command-line limit locally) and open a PR with the delta.
# Run from the Actions tab -> bootstrap -> Run workflow.
#
#   mode=prune  (default) — SHRINK: drop entries whose smells are now fixed. The
#                normal refresh, run after a batch of fixes lands (or a threshold
#                change makes findings disappear). Never adds entries.
#   mode=snooze — first-time bootstrap only: baseline every current smell. Use to
#                seed the baseline; a source PR must never grow it afterwards.
name: bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prune = shrink (drop fixed entries); snooze = seed baseline (first time only)"
        type: choice
        options: [prune, snooze]
        default: prune

permissions:
  contents: read

jobs:
  bootstrap-habits-baseline:
    name: Bootstrap habit-hooks baselines
    runs-on: ubuntu-latest
    # Opens a PR rather than pushing to main: main is a protected branch, so a
    # direct push from the bot is rejected. contents:write to push the branch,
    # pull-requests:write to open the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Cache PMD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/opt/pmd-bin-7.27.0
          key: pmd-7.27.0
      - name: Install tools
        run: |
          if [ ! -x "$HOME/.local/opt/pmd-bin-7.27.0/bin/pmd" ]; then
            mkdir -p "$HOME/.local/opt"
            curl -fsSL -o /tmp/pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases/7.27.0/pmd-dist-7.27.0-bin.zip
            unzip -q /tmp/pmd.zip -d "$HOME/.local/opt"
          fi
          echo "$HOME/.local/opt/pmd-bin-7.27.0/bin" >> "$GITHUB_PATH"
          pip install --disable-pip-version-check habit-hooks habit-hooks-java habit-hooks-typescript
          (cd frontend && npm ci)
      - name: Refresh baselines (${{ inputs.mode }})
        run: |
          (cd backend && habit-sensors --all | habit-snooze --${{ inputs.mode }})
          (cd frontend && export PATH="$PWD/node_modules/.bin:$PATH" && habit-sensors --all | habit-snooze --${{ inputs.mode }})
      - name: Open a PR with the regenerated baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add backend/.habit-hooks/snooze.json frontend/.habit-hooks/snooze.json
          if git diff --cached --quiet; then echo "baselines unchanged — nothing to do"; exit 0; fi
          branch="chore/refresh-habit-baseline-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore: refresh habit-hooks snooze baselines"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: refresh habit-hooks snooze baselines" \
            --body "Regenerated by the bootstrap workflow. Review the delta — it should only ever **shrink** (a new entry means a smell slipped past the gate and is worth a look), then merge. Touches only the baseline, no source, so ruleset-guard passes without a label." \
            --label ruleset-change
