# Regenerate the habit-hooks snooze baselines on Linux (the full-repo file list blows
# the Windows command-line limit locally) and open a PR per package with the delta.
# A prune only shrinks the baseline, so its PR auto-merges once the checks pass; it's
# opened as the bootstrap GitHub App so those checks run without a manual approval.
# Run by hand from Actions -> bootstrap when you want it sooner.
name: bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  backend:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@0b0275720481eb4c064562dc65b85d292204398a # v2.11.0
    permissions: { contents: write, pull-requests: write }
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: backend
      habit_hooks_plugin: habit-hooks-java
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}

  frontend:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@0b0275720481eb4c064562dc65b85d292204398a # v2.11.0
    permissions: { contents: write, pull-requests: write }
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: frontend
      habit_hooks_plugin: habit-hooks-typescript
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
