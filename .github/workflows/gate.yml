# Deterministic build gates per package, on Foundry's gate facade. Image publishing
# lives in deploy.yml (push-to-main only). See also: quality.yml, security.yml,
# deploy.yml, bootstrap.yml.
name: gate

# PR-only: branch protection requires this gate green on a branch that is up to date
# with main, so the merge commit is the code the PR already gated. workflow_dispatch is
# the manual full run after a risky merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: CMaintz/foundry/.github/workflows/changes.yml@0b0275720481eb4c064562dc65b85d292204398a # v2.11.0
    with:
      packages: "backend frontend extension"
      # Builds nothing for these; any other root-level file rebuilds everything (fail-safe).
      ignore_globs: |
        *.md
        docs/*
        .claude/*
        LICENSE
        .gitignore
        .gitattributes
        .editorconfig
        */.habit-hooks/snooze.json
        */eslint-suppressions.json

  backend:
    name: Backend gate
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'backend')
    uses: CMaintz/foundry/.github/workflows/gate.yml@0b0275720481eb4c064562dc65b85d292204398a # v2.11.0
    with:
      stack: java
      working_directory: backend
      spotbugs: true

  frontend:
    name: Frontend gate
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    uses: CMaintz/foundry/.github/workflows/gate.yml@0b0275720481eb4c064562dc65b85d292204398a # v2.11.0
    with:
      stack: ts
      working_directory: frontend

  # The one required check: skipped packages are fine, failed or cancelled aren't.
  gate-ok:
    name: gate-ok
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Iterates over needs itself, so a job added to needs above is checked
          # automatically. Skipped (path-filtered) is fine; failure/cancelled is not.
          bad="$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result=="failure" or .value.result=="cancelled") | .key')"
          if [ -n "$bad" ]; then echo "::error::job(s) did not pass: $bad"; exit 1; fi
          echo "gate-ok"
