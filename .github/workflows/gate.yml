# Deterministic build gates — the core "does it compile, lint, type-check, test"
# per package. Image publishing lives in deploy.yml (push-to-main only) so it
# doesn't show as a skipped check on PRs. See also: quality.yml, security.yml,
# deploy.yml, bootstrap.yml, semgrep.yml.
name: gate

# PR-only. main is branch-protected and we rebase-merge, so the merged commit is the
# same code the PR already gated. A push:main re-run has never (empirically, 28 runs)
# caught an integration break the PR missed — and the next PR's gate runs `mise run
# gate` against current main anyway, so any integration break surfaces there, one PR
# later. Not worth a run on every merge. deploy.yml/bootstrap.yml still fire on
# push:main; workflow_dispatch is the manual full-run for after a risky merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detect which parts of the monorepo this PR touches, so a frontend-only change
  # doesn't spin up the backend gate (and vice versa). A manual workflow_dispatch run
  # isn't a PR, so it runs everything. Shared/root files (workflows, mise, gradle,
  # scripts) run everything too.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      extension: ${{ steps.f.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          emit() { { echo "backend=$1"; echo "frontend=$2"; echo "extension=$3"; } >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then emit true true true; exit 0; fi
          base=$(git merge-base "$BASE" "$HEAD")
          diff=$(git diff --name-only "$base" "$HEAD")
          echo "Changed files:"; echo "$diff" | sed 's/^/  /'
          be=false; fe=false; ex=false; all=false
          # FAIL SAFE: a path we can't classify runs everything (never silently skip
          # a check). Only known docs/metadata are treated as "affects no area".
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              backend/*)   be=true ;;
              frontend/*)  fe=true ;;
              extension/*) ex=true ;;
              *.md|LICENSE|.gitignore|.gitattributes|.editorconfig|docs/*|.claude/*) : ;;
              mise.toml|.github/workflows/*|gradlew|gradlew.bat|gradle/*|settings.gradle*|build.gradle*|.gitleaks.toml|osv-scanner.toml|scripts/*) all=true ;;
              *) echo "  unclassified path '$f' -> running everything (fail-safe)"; all=true ;;
            esac
          done < <(printf '%s\n' "$diff")
          if [ "$all" = true ]; then be=true; fe=true; ex=true; fi
          emit "$be" "$fe" "$ex"

  backend:
    name: Backend gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Spotless ratchetFrom origin/main needs history, not a shallow tip

      # Restore PMD before mise installs: the mise.toml postinstall hook provisions
      # PMD (setup:pmd), which no-ops when this cache hits — so the gate job doesn't
      # re-download it every run. Keyed on the pinned version. (mise-action itself
      # caches java/node under ~/.local/share/mise; PMD lives in ~/.local/opt.)
      - name: Cache PMD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/opt/pmd-bin-7.27.0
          key: pmd-7.27.0
      # Runs the same verb a developer runs locally: `mise run backend:gate`
      # (Spotless format check + compile + the offline test suite). mise pins
      # java 21 + node 20 from mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
          cache: true
      # Cache Gradle deps + build across runs (mise pins the JDK but not ~/.gradle).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # `mise run backend:gate` decomposed one verb per step, so a failure reddens
      # the exact verb in the UI and gets a targeted fix instead of a wall of Gradle
      # output. The composite still runs locally / in /ship.
      - name: 'backend: lint (Spotless)'
        id: lint
        run: mise run backend:lint
      - name: How to fix (lint)
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## ❌ Backend gate failed at \`lint\` — Spotless formatting"
            echo ""
            echo "**This is 100% mechanical.** Run it, commit, push — done:"
            echo '```'
            echo "mise run backend:fix     # = ./gradlew :backend:spotlessApply"
            echo '```'
            echo "The exact files are in the **backend: lint** step log above. (Structural smells are the separate 'Structural smells (backend)' job, not this.)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'backend: typecheck (compile)'
        id: typecheck
        run: mise run backend:typecheck
      - name: How to fix (typecheck)
        if: failure() && steps.typecheck.outcome == 'failure'
        run: |
          {
            echo "## ❌ Backend gate failed at \`typecheck\` — compilation"
            echo ""
            echo "Not auto-fixable. The file:line is in the **backend: typecheck** step log above; reproduce with \`mise run backend:typecheck\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'backend: test'
        id: test
        run: mise run backend:test
      - name: How to fix (test)
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## ❌ Backend gate failed at \`test\`"
            echo ""
            echo "A test failed. See the **backend: test** step log and the uploaded test-report artifact; reproduce with \`mise run backend:test\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        if: always() # a failing run is exactly when the report is worth having
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node's npm cache only restores the download tarballs (~/.npm); npm ci
      # still wipes and rebuilds node_modules every run (~107s). Cache node_modules
      # itself, keyed on the lockfile, and skip the install on a hit. Shared with
      # habits-frontend via the same key.
      - name: Cache node_modules
        id: node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}

      - if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci

      # Warnings are advisory here: the existing accessibility warnings are real but pre-date this
      # pipeline, and failing on them would make CI useless on day one. Errors still fail the run.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  # The single required check for this workflow. Always runs, so a skipped backend
  # or frontend job (path-filtered) never leaves a required check stuck "Expected".
  # Fails only if a job that DID run failed.
  gate-ok:
    name: gate-ok
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}"; do
            case "$r" in failure|cancelled) echo "a required job did not pass: $r"; exit 1;; esac
          done
          echo "gate-ok"
