# Deterministic build gates — the core "does it compile, lint, type-check, test"
# per package. Image publishing lives in deploy.yml (push-to-main only) so it
# doesn't show as a skipped check on PRs. See also: quality.yml, security.yml,
# deploy.yml, bootstrap.yml, semgrep.yml.
name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Spotless ratchetFrom origin/main needs history, not a shallow tip

      # Runs the same verb a developer runs locally: `mise run backend:gate`
      # (Spotless format check + compile + the offline test suite). mise pins
      # java 21 + node 20 from mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.2
      # Cache Gradle deps + build across runs (mise pins the JDK but not ~/.gradle).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gate (lint + typecheck + test)
        run: mise run backend:gate

      - name: Publish test report
        if: always() # a failing run is exactly when the report is worth having
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node's npm cache only restores the download tarballs (~/.npm); npm ci
      # still wipes and rebuilds node_modules every run (~107s). Cache node_modules
      # itself, keyed on the lockfile, and skip the install on a hit. Shared with
      # habits-frontend via the same key.
      - name: Cache node_modules
        id: node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}

      - if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci

      # Warnings are advisory here: the existing accessibility warnings are real but pre-date this
      # pipeline, and failing on them would make CI useless on day one. Errors still fail the run.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
