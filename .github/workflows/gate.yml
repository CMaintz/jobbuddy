# Deterministic build gates per package, on Foundry's gate facade. Image publishing
# lives in deploy.yml (push-to-main only). See also: quality.yml, security.yml,
# deploy.yml, bootstrap.yml.
name: gate

# PR-only: main is protected and merges are rebased, so the merged commit is the code
# the PR already gated. workflow_dispatch is the manual full run after a risky merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: CMaintz/foundry/.github/workflows/changes.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    with:
      packages: "backend frontend extension"
      # Builds nothing for these; any other root-level file rebuilds everything (fail-safe).
      ignore_globs: |
        *.md
        docs/*
        .claude/*
        LICENSE
        .gitignore
        .gitattributes
        .editorconfig
        */.habit-hooks/snooze.json
        */eslint-suppressions.json

  backend:
    name: Backend gate
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'backend')
    uses: CMaintz/foundry/.github/workflows/gate.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    with:
      stack: java
      working_directory: backend
      spotbugs: true

  frontend:
    name: Frontend gate
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    uses: CMaintz/foundry/.github/workflows/gate.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    with:
      stack: ts
      working_directory: frontend

  # The one required check: skipped packages are fine, failed or cancelled aren't.
  gate-ok:
    name: gate-ok
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.backend.result }} ${{ needs.frontend.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "a required job did not pass: $r"; exit 1;; esac
          done
          echo "gate-ok"
