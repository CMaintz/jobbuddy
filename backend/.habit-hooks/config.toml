# Backend structural smells via PMD (habit-hooks Java plugin).
# Run from backend/ so PMD scans src/*.java. Baseline generated in CI (Linux) —
# see bootstrap.yml — because the full file list blows the Windows command-line
# limit locally.
plugins = ["java"]

# Tests are not structural-smell-gated. Long, mock-heavy test methods and many
# fixtures are normal and fine; CI should police production maintainability, not
# test structure. (no-var already scopes to src/main only.)
files = ["!**/src/test/**/*.java"]

# unused-import: PMD's UnnecessaryImport runs here without an aux-classpath, so it
# cannot resolve wildcard-import usage and false-flags e.g. `jakarta.persistence.*`
# on JPA entities. It is also redundant — Spotless `removeUnusedImports` already
# enforces unused-import correctly (with compilation context) in the gate. Disable
# it so the snooze baseline stays honest.
[smells.unused-import]
disabled = true
