# Backend structural smells: the `java` plugin (PMD → oversized-function,
# high-complexity, too-many-parameters, deep-nesting) + `generic` (jscpd duplication,
# and line-count for oversized-file). Matches foundry's java preset.
# Run from backend/ so PMD scans src/*.java. Baseline generated in CI (Linux) —
# see bootstrap.yml — because the full file list blows the Windows command-line
# limit locally. The tuned ruleset (pmd/ruleset.xml — ExcessiveParameterList
# minimum raised 4 -> 8) is picked up automatically by the sensor's project-
# ruleset discovery.
plugins = ["java", "generic"]

# Tests are not structural-smell-gated. Long, mock-heavy test methods and many
# fixtures are normal and fine; CI should police production maintainability, not
# test structure. (no-var already scopes to src/main only.)
# A positive include is REQUIRED — a bare "!exclusion" matches nothing, which
# silently disables the whole smell scan. Include all Java, then drop tests.
files = ["**/*.java", "!**/src/test/**/*.java"]

# args MUST be a TOML array, not a string: habit-hooks mangles a string arg into
# per-character ruleset refs (each char becomes a bogus `-R` value). As an array,
# each element is a clean token. -R names the tuned ruleset (ExcessiveParameterList
# minimum=8); --no-progress silences PMD's progress-bar WARN.
[sensors.pmd]
# --suppress-marker: `// foundry-allow-smell: <reason>` on a line accepts a genuine
# non-seam (a linear toEntity/save mapper, a flat long builder) on the record —
# reviewable, never a split-to-pass. Use sparingly, always with a reason.
args = ["--no-progress", "-R", "pmd/ruleset.xml", "--suppress-marker", "foundry-allow-smell"]

# File-length (generic line-count): flag files over 300 lines. Config/data/prose are
# excluded by `files`; keep big prompts in their own resource file, not inline.
[sensors.line-count]
args = ["--max", "300"]

# jscpd (the other half of `generic`) is a Node CLI — the backend has no Node, so it
# errors with `incomplete-run`. We keep `generic` only for its pure-Python line-count
# (file-length above). To add Java duplication detection, install Node + `npm i -g
# jscpd` in the smells job and locally, then remove this block.
[sensors.jscpd]
disabled = true

# unused-import: PMD's UnnecessaryImport runs here without an aux-classpath, so it
# cannot resolve wildcard-import usage and false-flags e.g. `jakarta.persistence.*`
# on JPA entities. It is also redundant — Spotless `removeUnusedImports` already
# enforces unused-import correctly (with compilation context) in the gate. Disable
# it so the snooze baseline stays honest.
[smells.unused-import]
disabled = true
