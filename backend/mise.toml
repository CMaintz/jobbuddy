# Backend (Java 21, Spring Boot) — the six verbs the foundry gate.yml@v2 facade runs
# (stack: java, working_directory: backend). backend/ is a subproject of the ROOT
# Gradle build, so every task calls `../gradlew :backend:<task>` — the root wrapper,
# the backend subproject.
#
# Tools (JDK, PMD, jscpd) and the setup:pmd hook are inherited from the root mise.toml
# — mise loads this file merged with the parent, and CI's mise-action (run in backend/)
# installs them. This file only overrides the six verbs so the facade, which calls the
# unprefixed `mise run <verb>` from backend/, resolves them here (nearest config wins)
# instead of falling through to the root's cross-package aggregates.

[env]
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-java"
# The habit-hooks venv bin (Linux `bin/`, Windows `Scripts/`; a missing one is harmless).
_.path = [
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
]

[hooks]
# Lists everything this package needs, so it holds whether mise merges or overrides
# the root postinstall. Each task no-ops on a warm install.
postinstall = ["mise run setup:pmd", "mise run setup:habit-hooks"]

[tasks.fix]
description = "Auto-format changed Java (Spotless)"
run = "../gradlew :backend:spotlessApply"

[tasks.lint]
description = "Format check (Spotless) + no-`var` + structural smells (habit-hooks/PMD) on changed source."
run = ["../gradlew :backend:spotlessCheck", "mise run novar", "mise run smells"]

[tasks.typecheck]
description = "Compilation is Java's type check"
run = "../gradlew :backend:compileJava"

[tasks.test]
description = "Backend test suite (offline by design)"
run = "../gradlew :backend:test"

[tasks.audit]
description = "Dependency CVEs via osv-scanner over the Gradle lockfile (needs osv-scanner on PATH)"
run = [
    "../gradlew :backend:dependencies --write-locks",
    "osv-scanner --lockfile=gradle.lockfile",
]

# no-`var`, ratchet-scoped: fails only on NEW `var` since the merge-base, never legacy.
# Base = FOUNDRY_BASE_REF (PR base SHA in CI; origin/main locally). `git diff` prints
# repo-root-relative paths, so `../$f` from backend/ resolves back to the real file.
# setup:pmd is inherited from the root config. Folded into `lint`.
[tasks.novar]
description = "no-`var` on changed backend Java (base = FOUNDRY_BASE_REF, default origin/main). Tag exceptions `// foundry-allow-var: reason`."
depends = ["setup:pmd"]
run = '''
set -eu
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "novar: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
files=$(git diff --name-only --diff-filter=ACMR "$mb" 2>/dev/null | grep -E '^backend/src/main/java/.*\.java$' || true)
if [ -z "$files" ]; then echo "novar: no changed backend main Java files"; exit 0; fi
set --
for f in $files; do set -- "$@" "-d=../$f"; done
pmd check "$@" -R config/pmd/no-var.xml -f text --no-progress --suppress-marker foundry-allow-var
'''

# Pinned habit-hooks (structural-smell detector), provisioned into a per-plugin venv
# by `mise install` (postinstall) so the same version runs in-loop, in `gate` and in CI.
# Keep HABIT_HOOKS_VERSION equal to the facade's `habit_hooks_version` default.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + plugin into a venv (smell detector)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Structural smells on files changed vs FOUNDRY_BASE_REF (PR base SHA in CI, origin/main
# locally), folded into `lint`. Calls the pinned venv binary directly so a global install
# can't shadow the pin. Skips without a .habit-hooks config/baseline or a resolvable base;
# fails only when a baseline exists but the pinned binary is missing (run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:pmd", "setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

# SpotBugs — auxiliary, opt-in, NOT a contract verb and NOT in `gate`. The facade's
# spotbugs job runs `mise run spotbugs` (foundry#36); blocking + ratcheted via
# config/spotbugs/exclude.xml (the ratchet lives in the Gradle SpotBugs config).
[tasks.spotbugs]
description = "SpotBugs bug-pattern analysis (blocking in CI; ratcheted via config/spotbugs/exclude.xml)"
run = "../gradlew :backend:spotbugsMain"

[tasks.gate]
description = "The oracle — lint, typecheck, test, audit, in order. Sequential (not `depends`, which is parallel)."
run = [
    "mise run lint",
    "mise run typecheck",
    "mise run test",
    "mise run audit",
]
