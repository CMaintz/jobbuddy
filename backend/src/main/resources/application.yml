spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autoapplicant}
    username: ${DB_USER:autoapplicant}
    password: ${DB_PASS:autoapplicant}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o
    embedding-model: text-embedding-3-small
  typesense:
    api-key: ${TYPESENSE_API_KEY:local-dev-key}
    host: ${TYPESENSE_HOST:localhost}
    port: ${TYPESENSE_PORT:8108}
    protocol: http
  crawler:
    cron: "0 0 */4 * * *"
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
  careerjet:
    affiliate-id: ${CAREERJET_AFFILIATE_ID:}
  greenhouse:
    # Verified live boards (200 OK with Danish jobs as of 2025-05):
    #   trustpilot: 59 total / 17 Danish  |  toogoodtogo: 72 total / 14 Danish
    #   pleo: board exists, 0 open roles currently (add back when they're hiring)
    # To add more: check https://boards.greenhouse.io/{token} — if it loads, add it here.
    companies:
      - trustpilot
      - toogoodtogo
  lever:
    # Verified: veo (Veo Technologies, Copenhagen) — 27 total / 23 Danish jobs
    # To add more: curl https://api.lever.co/v0/postings/{slug} — non-empty array = valid
    companies:
      - veo
  teamtailor:
    # Teamtailor's old teamtailor-jobs.com subdomains are defunct (DNS dead).
    # Add career page URLs for Danish companies you know use Teamtailor, e.g.:
    #   - https://careers.lunar.app       (Lunar Bank)
    #   - https://career.relesys.com      (Relesys)
    #   - https://careers.goodiebox.com   (Goodiebox)
    # The connector scrapes JSON-LD from each listing page — works for any career page
    # that uses schema.org/JobPosting markup (standard for all Teamtailor-hosted pages).
    career-page-urls: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
