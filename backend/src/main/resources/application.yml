spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autoapplicant}
    username: ${DB_USER:autoapplicant}
    password: ${DB_PASS:${POSTGRES_PASSWORD:localdevpassword}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

app:
  security:
    # Base64 AES key (16/24/32 bytes) used to encrypt users' own API keys at rest.
    # Unset means the app refuses to store them rather than keeping them in the clear.
    secret-encryption-key: ${SECRET_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
  ai:
    # enrichment-provider must be a real API (openai/gemini) — it produces embeddings for search.
    enrichment-provider: ${ENRICHMENT_AI_PROVIDER:openai}
    # Extraction (summary, skills, requirements) is chat-only, so it may run on the local CLI
    # agent even though embeddings cannot. This is the high-volume half — one call per posting,
    # thousands per crawl — so pointing it at a flat-fee CLI is what keeps a backfill cheap.
    # Blank = same as enrichment-provider. Values: openai | gemini | claude-cli | codex | cli
    enrichment-chat-provider: ${ENRICHMENT_CHAT_AI_PROVIDER:}
    # generation-provider: openai | gemini | claude-cli | codex | cli
    # claude-cli/codex/cli pipe prompts to a local agent CLI (flat-fee subscription) instead of an API.
    generation-provider: ${GENERATION_AI_PROVIDER:openai}
    # Spend tier per operation class (economy | standard | premium) -> resolves to the provider's tier model.
    # Bulk enrichment runs cheap; generation can be dialled up to premium. Defaults keep current models.
    enrichment-tier: ${ENRICHMENT_AI_TIER:economy}
    generation-tier: ${GENERATION_AI_TIER:standard}
    cli:
      command: ${AI_CLI_COMMAND:claude -p}   # e.g. "claude -p" or "codex exec"; prompt piped to stdin
      timeout-seconds: 120
      model-label: ${AI_CLI_MODEL_LABEL:cli-agent}
    auto-review:
      # Automatic reviewer critique/revise pass after document generation.
      # Each pass is one extra LLM call — disable to halve generation cost.
      enabled: ${AUTO_REVIEW_ENABLED:true}
      max-iterations: 1
    fact-guard:
      # Deterministic (model-free) check that generated metrics trace to the profile.
      # warn = log unsupported numbers; block = fail generation when any are found.
      enabled: ${FACT_GUARD_ENABLED:true}
      mode: ${FACT_GUARD_MODE:warn}
    cliche-guard:
      # Deterministic (model-free) check for Danish application cliches ("floskler") and the
      # English filler that reads as AI-generated. Findings are fed back to the reviewer pass.
      # warn = log surviving phrases; block = fail generation when any survive.
      enabled: ${CLICHE_GUARD_ENABLED:true}
      mode: ${CLICHE_GUARD_MODE:warn}
    retracted-claims:
      # Ensures a claim the user has disowned never resurfaces in generated content.
      # warn = log; block = fail generation when a retracted claim appears.
      mode: ${RETRACTED_CLAIMS_MODE:warn}
    evidence-elicitation:
      # AI assist for skill-evidence capture: tailored follow-up questions, and restructuring a
      # free-text answer into STAR fields. Disabling it falls back to template questions and the
      # user's raw text — the feature still works, with less polish.
      enabled: ${EVIDENCE_ELICITATION_ENABLED:true}
    company-grounding:
      # Fetch the company's own website (cached in DB) and extract verified facts to ground
      # cover-letter references, instead of parroting the untrusted posting.
      enabled: ${COMPANY_GROUNDING_ENABLED:true}
      staleness-days: 60
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    embedding-model: text-embedding-3-small
    economy-model: gpt-4o-mini
    standard-model: gpt-4o-mini
    premium-model: gpt-4o
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    embedding-model: gemini-embedding-001
    economy-model: gemini-2.5-flash
    standard-model: gemini-2.5-flash
    premium-model: gemini-2.5-pro
  reminders:
    # Daily "due today" email: reminders the user set and outreach follow-ups that have arrived.
    # Users with nothing due are not mailed — a usually-empty daily email gets filtered, and then
    # it is missing on the day it mattered.
    cron: "${DUE_REMINDER_CRON:0 0 7 * * *}"
  crawler:
    cron: "0 0 */4 * * *"
  job:
    # A posting not seen for this long is deactivated.
    stale-days: ${JOB_STALE_DAYS:30}
    url-check:
      # This is the liveness mechanism, not the crawl. Connectors stop after a page or two of
      # postings they already know, so they never revisit the deep end of a listing — which is
      # most of it. Probing is what confirms those are still up: a live URL refreshes lastSeenAt,
      # which is exactly what the staleness sweep reads.
      enabled: ${JOB_URL_CHECK_ENABLED:true}
      cron: ${JOB_URL_CHECK_CRON:0 30 */6 * * *}
      # Target: every active posting probed at least this often. Must stay well under
      # stale-days or live postings get retired for never having been looked at.
      recheck-days: ${JOB_URL_CHECK_RECHECK_DAYS:3}
      # Size the batch from the corpus rather than fixing it. A fixed 150 covered 600 a day,
      # so 17,000 postings took 28 days to get round — against a 30-day threshold.
      adaptive-batch: ${JOB_URL_CHECK_ADAPTIVE:true}
      batch-size: ${JOB_URL_CHECK_BATCH:150}
      # Ceiling, so a runaway corpus count cannot turn into a runaway crawl.
      max-batch-size: ${JOB_URL_CHECK_MAX_BATCH:3000}
      # Must match the cron above; the batch maths needs to know how often it runs.
      runs-per-day: ${JOB_URL_CHECK_RUNS_PER_DAY:4}
      politeness-delay-ms: ${JOB_URL_CHECK_DELAY_MS:300}
  enrichment:
    # A posting is given up on after this many failed attempts, so one the model can
    # never summarise stops consuming quota on every sweep.
    max-attempts: ${ENRICHMENT_MAX_ATTEMPTS:4}
    # How long to leave a failed posting alone before trying it again.
    retry-delay: ${ENRICHMENT_RETRY_DELAY:PT6H}
    # How long to wait on one AI call before deciding the provider is not keeping up.
    call-timeout: ${ENRICHMENT_CALL_TIMEOUT:PT5M}
    sweep:
      # The enrichment worker. Postings are saved PENDING by the crawler and only become
      # enriched when this runs, so it is a worker rather than a clean-up pass: it ticks
      # often, works for a bounded slice, and hands its thread back.
      enabled: ${ENRICHMENT_SWEEP_ENABLED:true}
      # Gap between ticks. A tick arriving while the last is still working is skipped.
      # Short, because a tick that lands mid-batch is skipped anyway. Keeping it short is what
      # stops the worker idling between batches while a backlog is still waiting.
      interval-ms: ${ENRICHMENT_SWEEP_INTERVAL_MS:60000}
      # Let the app finish starting before the first drain.
      initial-delay-ms: ${ENRICHMENT_SWEEP_INITIAL_DELAY_MS:60000}
      batch-size: ${ENRICHMENT_SWEEP_BATCH:500}
      # Postings in flight at once. The old ingest path ran two concurrently, so anything
      # less here would make the primary path slower than what it replaced.
      concurrency: ${ENRICHMENT_SWEEP_CONCURRENCY:2}
      # Gap between windows. Small: this is the only enrichment path now, not a recovery pass,
      # and a two-second sleep per posting is two seconds of tax on every one of thousands.
      delay-ms: ${ENRICHMENT_SWEEP_DELAY_MS:250}
      # Time budget per tick — the batch stops here and the next tick continues.
      # The batch stops here and the next tick continues from where it left off. Long enough
      # to make real progress on a backlog of thousands, bounded so a stuck provider cannot
      # hold the worker thread indefinitely.
      budget: ${ENRICHMENT_SWEEP_BUDGET:PT1H}
  # Embeddings have their own queue and their own state, because they have their own failure
  # mode: extraction can succeed while embedding never runs, leaving a posting that looks
  # complete and is invisible to search and matching.
  embedding:
    sweep:
      enabled: ${EMBEDDING_SWEEP_ENABLED:true}
      interval-ms: ${EMBEDDING_SWEEP_INTERVAL_MS:60000}
      # Offset from the enrichment worker's first tick; they share one thread anyway.
      initial-delay-ms: ${EMBEDDING_SWEEP_INITIAL_DELAY_MS:120000}
      batch-size: ${EMBEDDING_SWEEP_BATCH:500}
      # Texts per API call. The embeddings endpoint takes an array and returns vectors in
      # order, so a chunk is one round trip rather than `chunk-size` of them.
      chunk-size: ${EMBEDDING_SWEEP_CHUNK:100}
      budget: ${EMBEDDING_SWEEP_BUDGET:PT30M}
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    # ── Job connector (public jobs-guest endpoints). Personal, low-volume use only. ──
    enabled: ${LINKEDIN_SCRAPER_ENABLED:true}
    # Pipe-separated LinkedIn place strings (comma is part of a place name, so it can't be the separator).
    locations: ${LINKEDIN_LOCATIONS:Denmark}
    job-age-days: 14          # only pull postings from the last N days (recency filter)
    max-pages-per-query: 2    # 10 results per page
    queries-per-run: 10       # rotate a subset of (keyword × location) searches each run
    max-jobs-per-run: 40      # hard ceiling on new detail fetches per run — the main volume guard
    min-delay-ms: 4000        # randomised pause between requests, lower bound
    max-delay-ms: 9000        # …upper bound
    schedule:
      cron: "0 0 9,13,18 * * *"   # a few times a day; the connector, not the cron, bounds volume
      jitter-max-minutes: 50      # random pre-run delay so runs don't land on a fixed tick
    plan:
      staleness-days: 14       # regenerate a user's keyword plan once it's older than this
      max-keywords: 30         # hard ceiling on keywords per profile (the "wide" budget)
      default-breadth: wide    # narrow | normal | wide
  careerjet:
    affiliate-id: ${CAREERJET_AFFILIATE_ID:}
  greenhouse:
    # To add more: check https://boards.greenhouse.io/{token} — if it loads, add it here.
    companies:
      # Copenhagen
      - trustpilot        # Trustpilot, Copenhagen — review platform
      - toogoodtogo       # Too Good To Go, Copenhagen — food waste app
      - wolt              # Wolt, Copenhagen — food delivery unicorn
      - hellomonday       # HELLOMONDAY/DEPT®, Copenhagen+Aarhus — digital agency
  lever:
    # To add more: curl https://api.lever.co/v0/postings/{slug} — non-empty array = valid
    companies:
      # Copenhagen
      - veo               # Veo Technologies, Copenhagen — sports cameras
      - dixa              # Dixa, Copenhagen — customer service platform
      - vivino            # Vivino, Copenhagen — wine marketplace
      - contractbook      # Contractbook, Copenhagen — contract management
  teamtailor:
    # Format: {company}.teamtailor.com — verify at https://{slug}.teamtailor.com/jobs before adding.
    career-page-urls:
      - https://netnordicdenmark.teamtailor.com  # Net Nordic Denmark
      - https://bankdata.teamtailor.com          # Bankdata (financial IT)
      - https://relesys.teamtailor.com           # Relesys (retail HR software)
      - https://goodiebox.teamtailor.com         # Goodiebox
      - https://onomondo.teamtailor.com          # Onomondo (IoT connectivity)
      - https://normative.teamtailor.com         # Normative (carbon accounting)
      - https://trifork.teamtailor.com           # Trifork (software consultancy)
      - https://templafy.teamtailor.com          # Templafy (document automation)
      - https://veo.teamtailor.com               # Veo Technologies (sports cameras)
      - https://dfdsdenmark.teamtailor.com       # DFDS Denmark — shipping & logistics
      - https://ecoonline.teamtailor.com         # EcoOnline — HSE SaaS (CPH + Aarhus)
      - https://cepheo.teamtailor.com            # Cepheo — MS Dynamics consulting (CPH + Aarhus + Aalborg)
      - https://danskindustri.teamtailor.com     # Dansk Industri — business confederation (CPH + Aarhus)
      - https://power.teamtailor.com             # Power Danmark — consumer electronics retail
      - https://wspdenmark.teamtailor.com        # WSP Denmark — engineering consultancy
      # Aarhus & Jutland
      - https://eg.teamtailor.com                # EG A/S, Skanderborg — business software
      - https://prevas.teamtailor.com            # Prevas — embedded systems & IoT (Aarhus + Aalborg)
      - https://twodaydenmark.teamtailor.com     # TwoDay - Software consultancy
      - https://careers-dk.columbusglobal.com    # Columbus Denmark — ERP/data consultancy (Aarhus + CPH)
  cornerstone-on-demand:
    # To add more: find URL pattern https://{tenant}.csod.com/ux/ats/careersite/{siteId}/home
    tenants:
      - name: tdc
        site-id: 17        # TDC / Nuuday / TDC Erhverv, Copenhagen

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
