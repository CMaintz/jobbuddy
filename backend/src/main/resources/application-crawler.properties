# Crawler-profile settings: run as a one-shot CLI command (no HTTP server)
spring.main.web-application-type=none
# Keep security context available without HTTP
spring.security.filter.dispatcher-types=

# Disable OpenAPI scanner (not needed in CLI mode)
springdoc.api-docs.enabled=false

# Reduce startup noise
spring.jmx.enabled=false

# A crawl that does not enrich must embed what ingest stored, or nothing is embedded at all.
# Following the enrichment switch means one setting (ENRICHMENT_SWEEP_ENABLED) decides both;
# EMBEDDING_REQUIRE_ENRICHED still overrides it.
app.embedding.require-enriched=${app.enrichment.sweep.enabled:true}

# One migrator per database: the desktop app migrates the shared schema, and this job only
# checks that it is current (SchemaVersionCheck).
spring.flyway.enabled=false

# Nothing in the crawl uses Quartz, and its scheduler would only add threads to a one-shot job.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
