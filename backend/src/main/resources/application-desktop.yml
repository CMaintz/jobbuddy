# The desktop app: the backend runs on the user's own PC, started by the desktop shell, for one
# user. Security is SecurityConfig.desktopFilterChain (no Firebase); see README "Desktop profile".

server:
  # Only this PC can connect, and the peer address DesktopTokenFilter checks is the socket's,
  # never one a client claims in X-Forwarded-For. Env vars could override both, so
  # DesktopServerGuard refuses to start unless they still hold.
  address: 127.0.0.1
  forward-headers-strategy: none

app:
  # Program Files is not writable, so uploads and logs go to the user's local app data.
  # LOCALAPPDATA is Windows-only; elsewhere this falls back to the home directory.
  data-dir: ${APP_DATA_DIR:${LOCALAPPDATA:${user.home}}/JobBuddy}
  desktop:
    # Generated by the shell for each launch and passed in the environment, never stored.
    # Required: the app refuses to start without it (see DesktopToken).
    token: ${JOBBUDDY_DESKTOP_TOKEN:}
    # The one origin the shell's UI is served from. Every other origin is refused by CORS.
    shell-origin: ${DESKTOP_SHELL_ORIGIN:app://jobbuddy}
  ai:
    # Generation and extraction run on the user's own Claude Code login. Embeddings still need
    # an API key (ENRICHMENT_AI_PROVIDER), because the CLI cannot produce them.
    generation-provider: ${GENERATION_AI_PROVIDER:claude-cli}
    enrichment-chat-provider: ${ENRICHMENT_CHAT_AI_PROVIDER:claude-cli}
  crawler:
    # Every source but LinkedIn is crawled by a scheduled GitHub Actions workflow, not here.
    # LinkedIn stays on this PC (app.linkedin.schedule): its keyword plans need the user's Claude
    # login, and it is gentler on LinkedIn from a residential IP than from a datacenter.
    cron: "-"
  job:
    # The workflow's crawl run also probes posting URLs and expires stale postings. Doing it
    # here as well would race it on the same database.
    expiry-cron: "-"
    url-check:
      cron: "-"
